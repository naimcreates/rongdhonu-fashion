<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>অ্যাডমিন — রঙধনু ফ্যাশন</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><a class="brand" href="/admin">রঙধনু <span>ফ্যাশন — অ্যাডমিন</span></a><span class="sp"></span>
<span class="small" id="adminWho"></span>
<a class="btn ghost small" href="/">দোকান দেখুন</a>
<button class="btn ghost small" id="logoutBtn" style="display:none" onclick="logout()">লগআউট</button></header>
<div class="admin-shell" id="shell" style="display:none">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="admin-main" id="app"></main>
</div>
<div class="wrap" id="loginWrap">
  <div class="card" style="max-width:380px;margin:40px auto">
    <h2>অ্যাডমিন লগইন</h2>
    <p class="small">অ্যাডমিন PIN দিয়ে লগইন করুন। PIN জানা না থাকলে দোকানের মালিকের কাছে জিজ্ঞাসা করুন। Viewer রোল শুধু দেখতে পারবে, কিছু বদলাতে পারবে না।</p>
    <label>PIN</label>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="••••">
    <button class="btn ghost" onclick="const e=document.getElementById('pin');e.type=e.type==='password'?'text':'password'">দেখুন</button></div>
    <p><button class="btn" onclick="login()">লগইন</button></p>
    <div id="err"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script src="/admin.js"></script>
</body>
</html>
